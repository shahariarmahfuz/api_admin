services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orvia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - API_SECRET=${API_SECRET}
      - ENVIRONMENT=production
      - CORS_ORIGINS=["*"]
      - PORT=8000
    depends_on:
      redis:
        condition: service_started
        required: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orvia-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: orvia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
